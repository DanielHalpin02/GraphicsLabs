
<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
        }

      canvas { /*Black border drawn around canvas */
                border: 4px solid black;
        }
    </style>

  </head>

  <body>
    <h1>Daniel Halpin</h1> 

    <canvas id="canvas-for-ball" width="600" height="400"></canvas>

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");

      class Ball{
        constructor(x, y ,xSpeed, ySpeed, r){
          this.x=x;
          this.y = y;
          this.xSpeed = xSpeed;
          this.ySpeed = ySpeed;
          this.r = r;
        }

        draw(){
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, 0,2*Math.PI);
          ctx.stroke();
        }

        move() {
          //code to update the Y location
          this.y += this.ySpeed;

          if(this.y + this.r >= canvas.height){
            this.ySpeed *= -1;
          }

          if(this.y - this.r <= 0){
          this.ySpeed *= -1;
          }

          //code to update the X location
          this.x += this.xSpeed;

          if(this.x + this.r >= canvas.width){
            this.xSpeed *= -1;
          }

          if(this.x - this.r <= 0){
          this.xSpeed *= -1;
          }

        }

        //resize method to change size of ball
        resize(newRadius){
          this.r = newRadius;
        }
      }
      //Pacman class that extends Ball so it gets x,y, soeed and r
      class Pacman extends Ball{
        constructor(x,y,xSpeed,ySpeed,r){
          super (x,y,xSpeed,ySpeed,r);
        }
      draw(){
        var start = Math.PI / 4 + Math.PI;
        var end = 7 * (Math.PI /4)+Math.PI;

        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r, start, end);
        ctx.lineTo(this.x, this.y);
        //polar to cartesian to get point where mouth starts
        var xMouth = (this.r * Math.cos(start))+ this.x;
        var yMouth = (this.r * Math.sin(start))+this.y;
        ctx.lineTo(xMouth, yMouth);
        ctx.stroke();
      }
      //pacman moves and bounces off the walls the same as the ball
      move(){
        super.move();
      }
      //resize method to change size of pacman
      resize(newRadius){
          this.r = newRadius;
      }
         
      }

      class Paddle{

        constructor (x,y,width,height,speed){
            this.x = x;
            this.y = y;
            this.width = width;
            this.height = height;
            this.speed = speed;

        }

        draw(){
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }

        //move the paddle up 
        moveUp(){
            this.y -= this.speed;
            
            //stop at the top of the canvas
            if(this.y <= 0){
                this.y = 0;
            }
        }
        //move paddle down
        moveDown(){
            this.y += this.speed;
            
            //stop at bottom of canvas
            if(this.y + this.height >= canvas.height){
                this.y = canvas.height - this.height;
            }
        }

        //move the paddle so its centre is at the mouse y position
        moveTo(y){
            this.y=y - this.height /2;

            //stop at the top of the canvas
            if(this.y = 0){
                this.y = 0;
            }

            //stop at bottom of canvas
            if(this.y + this.height >= canvas.height){
                this.y = canvas.height - this.height;
            }
        }
    }
      
      // Create new ball object
      var b1 = new Ball(50, 10, 3, 3, 8);
      
      //create new pacman object
      var p1 = new Pacman(300,200,-2,6,20);
      p1.resize(30);

      //create new paddle object
      var paddle1 = new Paddle(10,160,10,80,15);

      //keyboard controls
      window.addEventListener("keydown", function(event){
        switch(event.key){
            //up arrow moves paddle up
            case "ArrowUp":Pacman
            paddle1.moveUp();
            event.preventDefault();
            break;

        //down arrow moves paddle down
        case "ArrowDown":
            paddle1.moveDown();
            evennt.preventDefault();
            break;
        }
      }
    )

      //mouse controls the paddle
      canvas.addEventListener("mousemove", function(event) {
        var y = event.clientY - canvas.offsetTop;
        paddle.moveTo(y);
      });

      // A function to repeat every time the animation loops.
      function repeatme() {

        //clear the canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw the ball.
        b1.draw();
        b1.move();

        p1.draw();
        p1.move();

        //Drawing pacman
        //Adding Math.Pi will rotate the wedge 180degrees
        
        ctx.beginPath();
        ctx.arc(100, 120, 20, Math.PI/ 4+ Math.PI, 7 *(Math.PI / 4)+Math.PI);
        ctx.lineTo(100,120);
        xMouth = (20 * Math.cos(Math.PI /4 +Math.PI))+100;
        yMouth = (20 * Math.sin(Math.PI / 4 + Math.PI))+ 120;
        ctx.lineTo(xMouth, yMouth);
        ctx.stroke();

        paddle1.draw();

        window.requestAnimationFrame(repeatme);
      }
      
      // Get the animation going.
      repeatme();
    </script>

  </body>

</html>
