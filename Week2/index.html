
<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
        }

      canvas { /*Black border drawn around canvas */
                border: 4px solid black;
        }
    </style>

  </head>

  <body>
    <h1>Daniel Halpin</h1> //student name

    <canvas id="canvas-for-ball" width="600" height="400"></canvas>

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");

      class Ball{
        constructor(x, y ,xSpeed, ySpeed){
          this.x=x;
          this.y = y;
          this.xSpeed = xSpeed;
          this.ySpeed = ySpeed;
          this.r = r;
        }

        draw(){
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, 0.2*Math.PI);
          ctx.stroke();
        }

        move() {
          //code to update the Y location
          this.y += this.ySpeed;

          if(this.y + this.r >= canvas.height){
            this.ySpeed *= -1;
          }

          if(this.y - this.r <= 0){
          this.ySpeed *= -1;
          }

          //code to update the X location
          this.x += this.xSpeed;

          if(this.x + this.r >= canvas.width){
            this.xSpeed *= -1;
          }

          if(this.x - this.r <= 0){
          this.xSpeed *= -1;
          }

        }

        //resize method to change size of ball
        resize(newRadius){
          this.r = newRadius;
        }
      }
      
      
      // The vertical location of the ball.
      var y = 10;
      var x = 5;
      var ySpeed = 3;
      var xSpeed = 1;
      // A function to repeat every time the animation loops.
      function repeatme() {
        
        // Draw the ball (stroked, not filled).
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, 2 * Math.PI);
        ctx.stroke();

        // Update the y location.
        y += ySpeed;
        x += xSpeed;
        
        // If the ball hits the bottom of the canvas.
        if (y + 3 >= canvas.height) {
        // Stop the ball.
           ySpeed= -3;
        }

        else  if(y - 3 <= 0)
        {
            ySpeed = 3;
        }

         if (x + 3 >= canvas.width) {
        // Stop the ball.
           xSpeed= -3;
        }

        else  if(x - 3 <= 0)
        {
            xSpeed = 3;
        }
        
        
        
        window.requestAnimationFrame(repeatme);
      }
      
      // Get the animation going.
      repeatme();
    </script>

  </body>

</html>
